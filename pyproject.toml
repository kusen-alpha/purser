[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purser"
version = "0.2.0"
description = "Generic resource scheduling library for scraping: proxies, accounts, and custom resources."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "purser" }]
dependencies = [
    "backports.zoneinfo>=0.2.1; python_version < '3.9'",
    "tzdata>=2024.1; python_version < '3.9' and platform_system == 'Windows'",
    "redis>=5",
    "cryptography>=42",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
# REST API + Web console (`purser serve`).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# `purser status|ls|lease|import|events` against a running service.
cli = [
    "httpx>=0.27",
    "rich>=13",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "fakeredis>=2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "rich>=13",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-cov>=5",
]
lua = ["fakeredis[lua]>=2"]
mysql = ["aiomysql>=0.2"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
purser = "purser.cli:main"

[tool.setuptools.packages.find]
include = ["purser*"]

[tool.setuptools.package-data]
purser = ["py.typed", "ui/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: long lines are kept where a full expression is easier to read than a
# wrapped one; the codebase already documents intent at the expression level.
# UP009: UTF-8 source has been the default since Python 3.0, so the encoding
# declaration is not needed on any supported version (3.8+).
ignore = ["E501", "UP009"]

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates endpoint signatures at runtime; Python 3.8 cannot evaluate
# PEP 585 builtin generics or `|` unions, so typing.Dict / typing.Optional are
# required on the wire layer even though the rest of the codebase uses the
# modern spellings.
"purser/ui/server.py" = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
# Third-party deps without stubs (aiomysql, fakeredis, fastapi internals, ...)
# are treated as Any instead of blocking the check.
follow_imports = "skip"
exclude = ["tests/", "examples/"]
# FastAPI route decorators come from the skipped (untyped) fastapi module;
# the handlers keep their own annotations, so do not flag the decorator.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["aiomysql", "aiomysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backports.zoneinfo"]
ignore_missing_imports = true
