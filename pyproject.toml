[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "purser"
version = "0.5.0"
description = "Generic resource scheduling library for scraping: proxies, accounts, and custom resources."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "purser" }]
keywords = [
    "proxy-pool",
    "resource-scheduling",
    "scraping",
    "asyncio",
    "rate-limit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = [
    "redis>=5",
    "cryptography>=42",
    # Windows has no system IANA database, so zoneinfo needs the PyPI package
    # on every supported version (not just pre-3.9).
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
# REST API + Web console (`purser serve`).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# `purser status|ls|lease|import|events` against a running service.
cli = [
    "httpx>=0.27",
    "rich>=13",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6",
    "fakeredis>=2",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "rich>=13",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-cov>=5",
]
lua = ["fakeredis[lua]>=2"]
mysql = ["aiomysql>=0.2"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
purser = "purser.cli:main"

[project.urls]
Homepage = "https://github.com/kusen-alpha/purser"
Repository = "https://github.com/kusen-alpha/purser"
Documentation = "https://kusen-alpha.github.io/purser"
Issues = "https://github.com/kusen-alpha/purser/issues"
Changelog = "https://github.com/kusen-alpha/purser/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["purser*"]

[tool.setuptools.package-data]
purser = ["py.typed", "ui/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# A hung test must fail instead of blocking CI; thread mode works on Windows.
timeout = 300
timeout_method = "thread"
# Parallel by default: -n 4 leaves headroom for tests that spawn subprocesses
# (8 logical CPUs); --dist loadfile keeps each file (and its 4-way
# storage x coordination matrix) on one worker so in-file ordering holds.
# Serial/debug runs (--pdb, single test) override with: pytest -n0 ...
addopts = "-n 4 --dist loadfile"

[tool.coverage.run]
branch = true
source = ["purser"]
# Spawned scheduler processes write their own data file (COVERAGE_PROCESS_START).
parallel = true
concurrency = ["multiprocessing", "thread"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if sys.platform == \"win32\":",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: long lines are kept where a full expression is easier to read than a
# wrapped one; the codebase already documents intent at the expression level.
# UP009: UTF-8 source has been the default since Python 3.0, so the encoding
# declaration is never needed.
ignore = ["E501", "UP009"]

[tool.ruff.lint.isort]
# Grouped aliased re-exports (``from x import y as y``) stay one block so
# compatibility shims in ``purser.config`` remain readable.
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
strict = true
# Third-party deps without stubs (aiomysql, fakeredis, fastapi internals, ...)
# are treated as Any instead of blocking the check.
follow_imports = "skip"
exclude = ["tests/", "examples/"]
# FastAPI route decorators come from the skipped (untyped) fastapi module;
# the handlers keep their own annotations, so do not flag the decorator.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["aiomysql", "aiomysql.*"]
ignore_missing_imports = true
