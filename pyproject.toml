[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purser"
version = "0.2.0"
description = "Generic resource scheduling library for scraping: proxies, accounts, and custom resources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "purser" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "rich>=13",
    "redis>=5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "fakeredis>=2",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-cov>=5",
]
lua = ["fakeredis[lua]>=2"]
mysql = ["aiomysql>=0.2"]

[project.scripts]
purser = "purser.cli:main"

[tool.setuptools.packages.find]
include = ["purser*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: long lines are kept where a full expression is easier to read than a
# wrapped one; the codebase already documents intent at the expression level.
# UP009: this project targets Python 3.10, where UTF-8 source is the default.
ignore = ["E501", "UP009"]

[tool.mypy]
python_version = "3.10"
strict = true
# Third-party deps without stubs (aiomysql, fakeredis, fastapi internals, ...)
# are treated as Any instead of blocking the check.
follow_imports = "skip"
exclude = ["tests/", "examples/"]
# FastAPI route decorators come from the skipped (untyped) fastapi module;
# the handlers keep their own annotations, so do not flag the decorator.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["aiomysql", "aiomysql.*"]
ignore_missing_imports = true
