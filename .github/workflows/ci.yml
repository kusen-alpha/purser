name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .

  typecheck:
    name: typecheck (mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: mypy --strict
        run: mypy purser

  package:
    name: package (wheel + py.typed)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install build mypy
          python -m build --wheel
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Verify packaged assets
        working-directory: /tmp
        run: |
          python - <<'PY'
          import importlib.resources as resources

          assert (resources.files("purser") / "py.typed").is_file()
          assert (resources.files("purser.ui") / "static" / "index.html").is_file()
          PY
      - name: Type-check installed package
        working-directory: /tmp
        run: |
          cat > consumer.py <<'PY'
          from purser import AcquireRequest, Purser

          async def main() -> None:
              ps = Purser()
              pool = ps.create_pool("p", "proxy")
              async with pool.lease(AcquireRequest(consumer="c")):
                  pass
          PY
          cat > reveal.py <<'PY'
          from purser import Purser

          reveal_type(Purser)
          PY
          output=$(mypy --strict reveal.py 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q 'purser.facade.Purser'
          mypy --strict consumer.py

  test:
    name: test (py${{ matrix.python-version }})
    needs: [lint, typecheck]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 runs in the coverage job (it needs redis/mysql services).
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest tests -q

  coverage:
    name: coverage (py3.12, line+branch 90%)
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: purser
          MYSQL_DATABASE: purser_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppurser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PURSER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      PURSER_TEST_MYSQL_URL: mysql://root:purser@127.0.0.1:3306/purser_test
      # Lets spawn()ed scheduler processes start coverage (tests/_coverage_boot).
      COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: pytest (coverage)
        run: coverage run -m pytest tests -q
      - name: combine
        run: coverage combine
      - name: report (gate 90%)
        run: coverage report --fail-under=90
      - name: xml
        run: coverage xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  test-windows:
    name: test (windows, py3.10)
    needs: [lint, typecheck]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: pytest (memory + sqlite; redis/mysql cases skip)
        run: pytest tests -q

  examples:
    name: examples (quickstart)
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run quickstart
        run: python examples/quickstart.py

  stress:
    name: stress (chaos + multiprocess)
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: purser
          MYSQL_DATABASE: purser_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppurser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PURSER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      PURSER_TEST_MYSQL_URL: mysql://root:purser@127.0.0.1:3306/purser_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: chaos + multiprocess stress
        run: pytest tests/test_chaos_storm.py tests/test_multiprocess_stress.py -q

  docs:
    name: docs (mkdocs strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -e ".[docs]"
      - name: mkdocs build --strict
        run: mkdocs build --strict
