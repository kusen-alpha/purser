site_name: Purser
site_description: 通用采集资源调度库：代理、账号与自定义资源的租约、验活与公平调度
docs_dir: docs
site_dir: site

site_url: https://kusen-alpha.github.io/purser/
repo_url: https://github.com/kusen-alpha/purser
edit_uri: edit/master/docs/

exclude_docs: |
  design/design-doc.md
  design/feasibility.md
  design/bundle-v2.md

theme:
  name: material
  language: zh
  logo: assets/logo-white.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: 跟随系统

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

plugins:
  - search:
      lang: [zh]
  - redirects:
      redirect_maps:
        guides/threading.md: guides/sync-facade.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 首页: index.md
  - 上手:
      - 概览: getting-started/index.md
      - 安装: getting-started/install.md
      - 嵌入式快速开始: getting-started/quickstart-async.md
      - 服务快速开始: getting-started/quickstart-service.md
  - 教程:
      - 概览: tutorials/index.md
      - 代理池 + httpx/aiohttp: tutorials/proxy-pool.md
      - 账号 + 代理组合租约: tutorials/account-proxy-bundle.md
      - 从脚本到服务: tutorials/script-to-service.md
      - 验活、召回与封禁: tutorials/validate-and-recall.md
  - 指南:
      - 概览: guides/index.md
      - 核心语义:
          - 资源可用性判定: guides/availability.md
          - 租约生命周期: guides/lease-lifecycle.md
          - 组合租约: guides/bundle-leases.md
          - 公平性与健康度: guides/fairness-and-health.md
      - 接入方式:
          - 导入与验活: guides/import-and-validate.md
          - 自定义资源适配器: guides/custom-resource-adapter.md
          - 门面族与运行时选择: guides/facades.md
          - 同步 Purser: guides/sync-facade.md
          - 多进程使用: guides/multiprocessing.md
      - 部署与安全:
          - 多实例部署: guides/multi-instance.md
          - 后端配置示例: guides/backend-configuration.md
          - 安全模型: guides/security.md
          - 生产检查清单: guides/production-checklist.md
          - 运维操作: guides/operations.md
          - Web 控制台: guides/web-console.md
          - 平台差异: guides/platform-differences.md
      - 观测与容量:
          - 可观测性: guides/observability.md
          - 性能与容量: guides/performance.md
          - 数据保留: guides/data-retention.md
      - 排障与迁移:
          - 排障: guides/troubleshooting.md
          - 常见问题: guides/faq.md
          - 从 0.4 升级到 0.6: guides/migration-0.4-to-0.5.md
          - 术语表: guides/glossary.md
  - 参考:
