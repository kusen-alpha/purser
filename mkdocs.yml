      - CLI: reference/cli.md
      - 配置: reference/configuration.md
      - 内置资源适配器: reference/resource-adapters.md
      - LocalScheduler: reference/local-scheduler.md
      - 错误处理: reference/errors.md
      - 错误码: reference/error-codes.md
      - 状态机: reference/state-machine.md
      - 事件目录: reference/events.md
      - 指标目录: reference/metrics.md
      - 审计目录: reference/audit.md
      - 数据模型: reference/data-models.md
      - 分配器: reference/allocators.md
      - AdapterSpec: reference/adapter-spec.md
      - 协议与门面契约: reference/protocols.md
